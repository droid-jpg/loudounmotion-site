<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loudoun Motion | Short video ads for local businesses</title>
<meta name="description" content="Loudoun Motion makes short video ads for local businesses in Sterling, Ashburn and across Loudoun County, VA.">
<style>
  :root { --bg:#0f1115; --fg:#f4f1ea; --muted:#9a9a9f; --accent:#e8b04b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    background:var(--bg); color:var(--fg);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    display:flex; flex-direction:column; min-height:100vh;
    padding:clamp(24px, 5vw, 56px);
  }
  header { font-weight:700; letter-spacing:.14em; text-transform:uppercase; font-size:.85rem; }
  header span { color:var(--accent); }
  main { flex:1; display:flex; flex-direction:column; justify-content:center; max-width:720px; }
  h1 { font-size:clamp(2.4rem, 7vw, 4.6rem); line-height:1.02; letter-spacing:-.02em; margin-bottom:24px; }
  h1 em { font-style:normal; color:var(--accent); }
  p { color:var(--muted); font-size:clamp(1.05rem, 2.2vw, 1.25rem); line-height:1.55; max-width:560px; }
  .cta { display:inline-block; margin-top:36px; padding:14px 26px; border-radius:999px;
         background:var(--accent); color:#16130c; font-weight:600; text-decoration:none; width:fit-content; }
  .cta:hover { filter:brightness(1.08); }
  footer { color:var(--muted); font-size:.85rem; display:flex; flex-wrap:wrap; gap:8px 24px; }
  footer a { color:var(--muted); }
</style>
</head>
<body>
  <header>Loudoun <span>Motion</span></header>
  <main>
    <h1>Short video ads that make <em>local</em> businesses stand out.</h1>
    <p>Scroll-stopping 15–30 second ads for restaurants, gyms, detailers and shops in Sterling, Ashburn and across Loudoun County. Full site and sample work coming soon.</p>
    <a class="cta" href="mailto:hello@loudounmotion.com">hello@loudounmotion.com</a>
  </main>
  <footer>
    <span>Sterling, Virginia</span>
    <span>© 2026 Loudoun Motion</span>
  </footer>
</body>
</html>
